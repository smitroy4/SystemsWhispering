<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Systems Whispering — Learn the craft. Whisper to systems. Data structures and algorithms from scratch with Java code and animated visualizations."
    />
    <title>Systems Whispering</title>
    <script>
      try {
        var mode = localStorage.getItem('s4j-dsa-theme') || 'system';
        var dark =
          mode === 'dark' ||
          (mode !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
